name: Usage
options:
  bundleIdPrefix: com.an-mzn.codex-usage
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: 7FVL4J2UZ9
schemes:
  Usage:
    build:
      targets:
        Usage: all
        UsageWidget: all
        UsageCore: all
    test:
      targets:
        - UsageCoreTests
targets:
  UsageCore:
    type: framework
    platform: macOS
    sources:
      - Sources/UsageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.an-mzn.codex-usage.UsageCore
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  Usage:
    type: application
    platform: macOS
    sources:
      - Sources/Usage
      - path: Assets/UsageDark.icns
        buildPhase: resources
      - path: Assets/codex-usage.svg
        buildPhase: resources
      - path: Assets/openai.svg
        buildPhase: resources
      - path: Assets/claude.svg
        buildPhase: resources
      - path: Assets/google.svg
        buildPhase: resources
    dependencies:
      - target: UsageCore
      - target: UsageWidget
        embed: true
    entitlements:
      path: App.entitlements
      properties:
        com.apple.security.application-groups:
          - 7FVL4J2UZ9.com.an-mzn.codex-usage
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Usage
        CFBundleIconFile: UsageDark.icns
        CFBundleVersion: "49"
        CFBundleName: Usage
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.an-mzn.codex-usage.CodexUsage
  UsageWidget:
    type: app-extension
    platform: macOS
    sources:
      - Sources/UsageWidget
      - path: Assets/codex-usage.svg
        buildPhase: resources
      - path: Assets/openai.svg
        buildPhase: resources
      - path: Assets/claude.svg
        buildPhase: resources
      - path: Assets/google.svg
        buildPhase: resources
    info:
      path: Widget-Info.plist
      properties:
        CFBundleDisplayName: Usage
        CFBundleVersion: "49"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - target: UsageCore
    entitlements:
      path: Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - 7FVL4J2UZ9.com.an-mzn.codex-usage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.an-mzn.codex-usage.CodexUsage.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_APP_SANDBOX: YES
  UsageCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/UsageCoreTests
    dependencies:
      - target: UsageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.an-mzn.codex-usage.tests
